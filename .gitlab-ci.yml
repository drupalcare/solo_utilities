# Drupal.org GitLab CI for Solo Utilities.
#
# For details on customizing this file see:
# https://www.drupal.org/docs/develop/git/using-gitlab-to-contribute-to-drupal/gitlab-ci
# https://project.pages.drupalcode.org/gitlab_templates/
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # Solo Utilities declares ^11.3 || ^12 (solo_utilities.info.yml), so every
  # major it claims gets a job: current (11) and next (12).
  # Run the jobs against the next major in addition to the current core
  # version so the D12 readiness of this branch is verified on every pipeline.
  OPT_IN_TEST_NEXT_MAJOR: '1'
  # THE LINE THAT WAS MISSING, and its absence is why that job had never run.
  # `OPT_IN_TEST_*` creates the job; `_AUTORUN_*` (default 'none') decides
  # whether it runs or sits behind a manual prerequisite. With only the opt-in
  # set, this project's D12 jobs showed as `manual`/`skipped` on every pipeline
  # while the pipeline itself reported success — measured 2026-09-06 on
  # pipeline 878576. A green pipeline with no coverage is worse than a missing
  # job, because it looks fine.
  _AUTORUN_NEXT_MAJOR: 'all'
  # Current core has moved past the 11.x floor, so the previous minor gets a
  # job too.
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  # No previous-major job: 2.0.x requires ^11.3 || ^12, so Drupal 10 is not
  # claimed (it stays on 1.0.x).

################
# Settings generator and project check scripts (python only, no Drupal needed).
# The generator builds Solo's settings schema, install defaults and the shipped
# maps from the Solo theme's 1.0.x-dev files, so the job clones Solo (both the
# working branch and 1.0.x-dev) and points SOLO_THEME_DIR at it. --check goes red
# when a generated file in that checkout differs from the generator's output.
# Run it locally: see scripts/settings-gen/README.md.
################
settings-gen-checks:
  stage: validate
  image: python:3.12-bookworm
  script:
    - export SOLO_THEME_DIR="$(mktemp -d "${TMPDIR:-/tmp}/solo-theme.XXXXXX")"
    - git clone --quiet --branch 2.0.x-dev https://git.drupalcode.org/project/solo.git "$SOLO_THEME_DIR"
    - git -C "$SOLO_THEME_DIR" fetch --quiet origin 1.0.x-dev:1.0.x-dev
    - python3 -I scripts/settings-gen/solo-schema-gen.py --check
    - python3 -I scripts/settings-gen/solo-schema-gen.py --self-test
    - python3 -I scripts/check-settings-bounds.py
    - python3 -I scripts/check-settings-defaults.py
    - python3 -I scripts/check-theme-detection.py
    - python3 -I scripts/check-regions.py
    - python3 -I scripts/check-regions.py --self-test
