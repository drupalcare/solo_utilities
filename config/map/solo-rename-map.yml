# Solo renames made while 2.0 was in development: classes, libraries, files, JavaScript names. Canonical: edit here only.
# Read by solo_utilities/src/Migration/SoloRenameMap.php (the drush solo:migrate-classes command) and by
# solo_utilities/scripts/class-list.py (the human list in solo/docs/CLASS-MIGRATION.md and class-migration.html).
# Source of the first fill: planning/rename-map-solo-2026-11-10.json (dated 2026-11-10); this file is the owner from now on.
# CSS variables are NOT repeated here: they live in solo-variable-map.yml (`removed`), and both tools read them from there.
# 1.x names live in solo-class-map.yml. A 1.x name whose 2.x target was renamed again is chained at load time, so a
# 1.x name maps straight to its final name; edit the 1.x row only when the 1.x meaning changes.
# Row: 'old': {new, action[, kind|op]}. Actions:
#   rewrite      the tool rewrites the old name where the file type allows; elsewhere it reports.
#   alias        as rewrite, and the old name keeps working in Solo for one major (a deprecated library id, a second JS
#                behavior name, both data attributes read). Informational for the reader of the list.
#   report-only  the tool never rewrites: the new name is not one name (a split or a merge), or the place is not safe to edit.
#                `new` then lists the replacements for a person to pick.
