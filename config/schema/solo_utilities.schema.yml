solo_utilities.color_schemes_rules.*:
  type: config_entity
  label: 'Color Schemes Rule'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: string
      label: 'Label'
    status:
      type: boolean
      label: 'Status'
    conditions:
      type: sequence
      label: 'Conditions'
      sequence:
        type: mapping
        label: 'Condition'
        mapping:
          id:
            type: string
            label: 'Condition ID'
          settings:
            type: mapping
            label: 'Condition settings'
            mapping:
              key:
                type: string
                label: 'Setting Key'
              value:
                type: string
                label: 'Setting Value'
          negate:
            type: boolean
            label: 'Negate'
    conjunction:
      type: string
      label: 'Conjunction'
    predefined_theme:
      type: string
      label: 'Predefined Theme'
    theme_category:
      type: string
      label: 'Theme Category'
    library:
      type: string
      label: 'Library'
  description: 'Configuration schema for the Color Schemes Rules in Solo Utilities module.'

block.block.*.third_party.solo_utilities:
  type: mapping
  label: 'Solo Utilities block title settings'
  mapping:
    solo_block_title_visibility:
      type: string
      label: 'Block title visibility mode'
      constraints:
        Choice:
          - visible
          - visually_hidden
          - none
    solo_block_title_tag:
      type: string
      label: 'Block title tag'
      constraints:
        Choice:
          - div
          - h1
          - h2
          - h3
          - h4
          - h5
          - h6
