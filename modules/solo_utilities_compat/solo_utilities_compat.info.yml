name: 'Solo Utilities Compatibility'
type: module
description: 'Lets custom code that reads Solo settings by their old names, or calls the Solo Utilities helper functions, keep working. Install it only when "drush solo:preflight" reports a call.'
package: 'Solo Suite'
core_version_requirement: ^11.3 || ^12
php: ^8.3
dependencies:
  - solo_utilities:solo_utilities
